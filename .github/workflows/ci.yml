name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m compileall -q baseline ansible tools
      - run: node --check static/app.js
      - run: python -m pytest -q tests/test_baseline.py tests/test_fleet.py tests/test_upgrade.py
