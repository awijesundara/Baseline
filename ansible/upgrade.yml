---
- name: Apply an approved OS package upgrade
  hosts: baseline_targets
  gather_facts: false
  become: false
  tasks:
    - name: Apply OS package upgrade
      ansible.builtin.script:
        cmd: "upgrade.py {{ baseline_packages }}"
        executable: /bin/sh
      when: baseline_os_family | default('linux') == 'linux'
      changed_when: true
    - name: Reboot after OS package upgrade
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: baseline_os_family | default('linux') == 'linux' and baseline_reboot | default(false) | bool
