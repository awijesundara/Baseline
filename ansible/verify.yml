---
- name: Collect Baseline evidence without changing host configuration
  hosts: baseline_targets
  gather_facts: false
  become: false
  tasks:
    - name: Read Linux operating system and hardware state
      ansible.builtin.script:
        cmd: collect.py
        executable: /bin/sh
      when: baseline_os_family | default('linux') != 'windows'
      changed_when: false
    - name: Read Windows operating system and hardware state
      ansible.builtin.raw: "{{ lookup('ansible.builtin.file', 'collect_windows.ps1') }}"
      when: baseline_os_family | default('linux') == 'windows'
      changed_when: false
